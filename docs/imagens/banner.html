<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1600px; height: 520px; overflow: hidden;
    background:
      radial-gradient(circle at 78% 18%, rgba(255, 0, 60, .35), transparent 42%),
      radial-gradient(circle at 18% 88%, rgba(0, 240, 255, .28), transparent 45%),
      linear-gradient(150deg, #08080c 0%, #12100d 55%, #1a1207 100%);
    font-family: "Segoe UI", Arial, sans-serif; color: #f5f1e6;
    display: flex; align-items: center; padding: 0 96px; position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(252, 238, 10, .06) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(252, 238, 10, .06) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(circle at 30% 50%, #000 35%, transparent 78%);
  }
  .scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 2px, transparent 2px 4px); opacity: .35; }
  .badge {
    display: inline-block; font-family: "Consolas", monospace; font-size: 15px; letter-spacing: 3px;
    color: #fcee0a; border: 2px solid #fcee0a; padding: 6px 12px; text-transform: uppercase;
  }
  h1 { font-size: 88px; line-height: .92; letter-spacing: -2px; font-weight: 800; margin: 22px 0 10px; text-transform: uppercase; }
  h1 .glitch { position: relative; color: #fff; text-shadow: 3px 0 rgba(255,0,60,.55), -3px 0 rgba(0,240,255,.55); }
  .sub { font-size: 26px; color: #d8d2c2; max-width: 900px; }
  .sub b { color: #fcee0a; font-weight: 700; }
  .left { position: relative; z-index: 2; }
  .right { position: absolute; right: 84px; top: 50%; transform: translateY(-50%); z-index: 2; }
  .chip { display: block; font-family: "Consolas", monospace; font-size: 16px; padding: 10px 16px; margin: 10px 0;
          border-left: 4px solid #00f0ff; background: rgba(0, 240, 255, .08); color: #d9f7ff; width: 360px; }
  .chip.red { border-color: #ff003c; background: rgba(255, 0, 60, .1); color: #ffd9e2; }
  .chip.yellow { border-color: #fcee0a; background: rgba(252, 238, 10, .09); color: #fff8c9; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="scan"></div>
  <div class="left">
    <span class="badge">Cyberpunk 2077 · 2.5</span>
    <h1><span class="glitch">Mission</span><br>Reset</h1>
    <p class="sub">Repõe as missões pelo <b>Replay Center</b>, o site dentro da NET.<br>Sem clone, sem terminal: baixa o zip e instala.</p>
  </div>
  <div class="right">
    <span class="chip">NETdir://replay.web</span>
    <span class="chip red">journal · facts · prefab · itens</span>
    <span class="chip yellow">Windows · Linux · Steam Deck</span>
  </div>
</body>
</html>
